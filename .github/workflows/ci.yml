name: CI

on:
  workflow_dispatch:
    inputs:
      full_evidence:
        description: 'Also retain the complete diagnostic selection for 1 day'
        type: boolean
        default: false
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host-quality:
    name: host-quality
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate workflows with actionlint 1.7.12
        shell: bash
        env:
          ACTIONLINT_VERSION: '1.7.12'
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -euo pipefail
          actionlint_archive="${RUNNER_TEMP}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          actionlint_dir="${RUNNER_TEMP}/actionlint-${ACTIONLINT_VERSION}"
          curl --fail --location --proto '=https' --tlsv1.2 \
            --output "${actionlint_archive}" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          printf '%s  %s\n' "${ACTIONLINT_SHA256}" "${actionlint_archive}" \
            | sha256sum --check --strict
          mkdir --parents "${actionlint_dir}"
          tar --extract --gzip --file "${actionlint_archive}" \
            --directory "${actionlint_dir}" actionlint
          chmod 0755 "${actionlint_dir}/actionlint"
          "${actionlint_dir}/actionlint" -shellcheck= -pyflakes=
      - name: Pinned Python
        uses: ./.github/actions/setup-python
        with:
          host-dependencies: 'true'
      - name: Node 24.22.1
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24.22.1
          package-manager-cache: false
      - name: Rust 1.90.0 and targets
        shell: bash
        run: |
          rustup toolchain install 1.90.0 --profile minimal
          rustup component add --toolchain 1.90.0 rustfmt clippy llvm-tools
          rustup target add --toolchain 1.90.0 x86_64-unknown-none x86_64-unknown-uefi
      - name: Coverage tooling (cargo-llvm-cov, coverage.py, c8)
        shell: bash
        run: |
          cargo +1.90.0 install cargo-llvm-cov --version 0.9.1 --locked
          python3 -m pip install --disable-pip-version-check --only-binary=:all: 'coverage==7.11.3'
          npm install --global c8@10.1.3
      - name: Cache Cargo downloads
        id: cargo-downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
          key: cargo-downloads-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/Cargo.lock') }}
      - name: Cache host Rust build intermediates
        id: host-build-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # Host-only outputs: never native images, acceptance reports or secrets.
          path: |
            target/debug
            sdk/target/debug
            services/net-protocol/target/debug
            experiments/quantum/target/debug
            experiments/quantum/job-protocol/target/debug
          key: host-rust-v3-ubuntu-24.04-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', '**/Cargo.lock', '**/Cargo.toml', '**/.cargo/config.toml', '**/build.rs') }}-${{ github.sha }}
          restore-keys: |
            host-rust-v3-ubuntu-24.04-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', '**/Cargo.lock', '**/Cargo.toml', '**/.cargo/config.toml', '**/build.rs') }}-
      - name: Fetch locked workspace dependencies before offline Python harnesses
        # The snapshot-wipe harness builds capability-core offline. Cargo still
        # resolves the workspace closure, including update-core's dependencies.
        run: cargo +1.90.0 fetch --locked --manifest-path Cargo.toml
      - name: Python syntax and DocumentSession host tests
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          mkdir -p build/coverage-raw/python
          python3 -m compileall -q tools tests userspace/tests experiments/quantum/native experiments/quantum/native/job .agents/skills/os-dev
          python3 -B -m unittest discover -s tests -p 'test_ci_evidence*.py'
          coverage run --parallel-mode -m unittest discover -s tests -p 'test_ci_workflows.py'
          coverage run --parallel-mode -m unittest discover -s tests -p 'test_document_session_*.py'
          coverage run --parallel-mode -m unittest discover -s tests -p 'test_volume_*.py'
          coverage run --parallel-mode -m unittest discover -s tests -p 'test_system_*.py'
          coverage run --parallel-mode -m unittest discover -s tools/tests -p 'test_*.py'
          python3 .agents/skills/os-dev/scripts/validate_skill.py
          coverage run --parallel-mode -m unittest discover -s .agents/skills/os-dev/tests -p 'test_*.py'
      - name: Runner and QEMU harness host tests
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          for pattern in test_common.py test_preflight.py test_build_paths.py test_guest_harness.py test_m1_artifact_binding.py 'test_m6c_*.py'; do
            coverage run --parallel-mode -m unittest discover -s tests -p "$pattern"
          done
      - name: Combine Python coverage and emit cobertura
        run: |
          coverage combine
          coverage xml
      - name: Root Rust host tests
        run: |
          cargo +1.90.0 llvm-cov --locked -p boot-protocol -p elf-loader-core -p kernel-core -p capability-core -p virtio-core -p ui-core -p virtio-blk-driver -p block-protocol -p object-core -p catalog-core -p volume-core -p keyring-core -p virtio-rng-driver -p virtio-net-driver -p driver-core -p pci-core -p update-core -p update-tool --cobertura --output-path build/coverage-raw/rust-cobertura.xml
          cargo +1.90.0 clippy --locked -p boot-protocol -p elf-loader-core -p kernel-core -p capability-core -p virtio-core -p ui-core -p virtio-blk-driver -p block-protocol -p object-core -p catalog-core -p volume-core -p keyring-core -p virtio-rng-driver -p virtio-net-driver -p driver-core -p pci-core -p update-core -p update-tool --all-targets -- -D warnings
          cargo +1.90.0 fmt --all -- --check
      - name: SDK tests and lint
        run: |
          cargo +1.90.0 test --manifest-path sdk/Cargo.toml --locked
          for manifest in sdk/examples/calculator/Cargo.toml sdk/examples/materiaal/Cargo.toml sdk/examples/compositor/Cargo.toml sdk/examples/desktop-init/Cargo.toml sdk/input-client/Cargo.toml; do
            cargo +1.90.0 test --manifest-path "$manifest" --locked --target-dir "$PWD/target"
          done
          cargo +1.90.0 clippy --manifest-path sdk/Cargo.toml --locked --all-targets -- -D warnings
          cargo +1.90.0 fmt --manifest-path sdk/Cargo.toml --all -- --check
          python3 -B sdk/examples/catalog-read/build.py
          python3 -B sdk/examples/volume-docs/build.py
      - name: User allocator and RTC core
        run: |
          cargo +1.90.0 test --locked --manifest-path sdk/heap-allocator/Cargo.toml
          cargo +1.90.0 clippy --locked --manifest-path sdk/heap-allocator/Cargo.toml --all-targets -- -D warnings
          cargo +1.90.0 fmt --manifest-path sdk/heap-allocator/Cargo.toml --all -- --check
          cargo +1.90.0 build --locked --release --target x86_64-unknown-none --manifest-path sdk/heap-allocator/Cargo.toml
          cargo +1.90.0 test --locked --manifest-path drivers/rtc/Cargo.toml
          cargo +1.90.0 clippy --locked --manifest-path drivers/rtc/Cargo.toml --all-targets -- -D warnings
          cargo +1.90.0 fmt --manifest-path drivers/rtc/Cargo.toml --all -- --check
          cargo +1.90.0 build --locked --release --target x86_64-unknown-none --manifest-path drivers/rtc/Cargo.toml
      - name: Keyring SDK and isolated input service core
        run: |
          cargo +1.90.0 test --locked --manifest-path sdk/keyring-client/Cargo.toml
          cargo +1.90.0 clippy --locked --manifest-path sdk/keyring-client/Cargo.toml --all-targets -- -D warnings
          cargo +1.90.0 fmt --manifest-path sdk/keyring-client/Cargo.toml --all -- --check
          cargo +1.90.0 test --locked --manifest-path services/input-core/Cargo.toml
          cargo +1.90.0 clippy --locked --manifest-path services/input-core/Cargo.toml --all-targets -- -D warnings
          cargo +1.90.0 fmt --manifest-path services/input-core/Cargo.toml --all -- --check
          cargo +1.90.0 build --locked --release --target x86_64-unknown-none --manifest-path services/input-core/Cargo.toml
      - name: Network parser tests and native cross-build
        run: |
          cargo +1.90.0 test --manifest-path services/net-protocol/Cargo.toml --locked
          cargo +1.90.0 clippy --manifest-path services/net-protocol/Cargo.toml --locked --all-targets -- -D warnings
          cargo +1.90.0 fmt --manifest-path services/net-protocol/Cargo.toml --all -- --check
          cargo +1.90.0 build --manifest-path services/net-protocol/Cargo.toml --locked --release --target x86_64-unknown-none
      - name: Quantum host verification
        run: |
          cargo +1.90.0 test --manifest-path experiments/quantum/Cargo.toml --locked
          cargo +1.90.0 clippy --manifest-path experiments/quantum/Cargo.toml --locked --all-targets -- -D warnings
          cargo +1.90.0 fmt --manifest-path experiments/quantum/Cargo.toml --all -- --check
          python3 experiments/quantum/verify.py
          cargo +1.90.0 test --manifest-path experiments/quantum/job-protocol/Cargo.toml --locked
          cargo +1.90.0 clippy --manifest-path experiments/quantum/job-protocol/Cargo.toml --locked --all-targets -- -D warnings
          cargo +1.90.0 fmt --manifest-path experiments/quantum/job-protocol/Cargo.toml --all -- --check
          python3 experiments/quantum/native/job/build.py --output-dir /tmp/nieuw-os-qsim-job-build --target-dir /tmp/nieuw-os-qsim-job-target
      - name: Product prototype tests
        env:
          NODE_V8_COVERAGE: build/coverage-raw/node/raw
        run: node --test --test-isolation=none ui/prototype/tests/*.test.mjs
      - name: NAS policy, storage and transport tests
        env:
          NODE_V8_COVERAGE: build/coverage-raw/node/raw
        run: node --test --test-isolation=none services/nas/tests/*.test.mjs
      - name: Combine Node coverage and emit cobertura
        shell: bash
        run: c8 report --temp-directory build/coverage-raw/node/raw --reporter cobertura --report-dir build/coverage-raw/node/report
      - name: Native M6c regression build
        run: python3 -B tools/build.py --kernel-feature milestone-m6c
      - name: Progress consistency and clean tree
        shell: bash
        run: |
          python3 tools/progress.py --write
          git diff --exit-code -- README.md docs/PROGRESS.md docs/assets/progress.svg
          python3 tools/progress.py --check
          git status --porcelain
          test -z "$(git status --porcelain)"
      - name: Preserve Rust coverage artifact
        if: ${{ always() }}
        uses: ./.github/actions/preserve-evidence
        with:
          name: coverage-report-rust
          job-status: ${{ job.status }}
          if-no-files-found: error
          path: build/coverage-raw/rust-cobertura.xml
      - name: Preserve Python coverage artifact
        if: ${{ always() }}
        uses: ./.github/actions/preserve-evidence
        with:
          name: coverage-report-python
          job-status: ${{ job.status }}
          if-no-files-found: error
          path: build/coverage-raw/python/cobertura.xml
      - name: Preserve JavaScript coverage artifact
        if: ${{ always() }}
        uses: ./.github/actions/preserve-evidence
        with:
          name: coverage-report-javascript
          job-status: ${{ job.status }}
          if-no-files-found: error
          path: build/coverage-raw/node/report/cobertura-coverage.xml
      - name: Cache diagnostics (not test evidence)
        if: ${{ always() }}
        shell: bash
        env:
          DOWNLOADS_HIT: ${{ steps.cargo-downloads.outputs.cache-hit }}
          HOST_BUILD_HIT: ${{ steps.host-build-cache.outputs.cache-hit }}
        run: |
          {
            echo '### CI cache diagnostics'
            printf 'Cargo downloads exact cache-hit: `%s`\n\n' "${DOWNLOADS_HIT:-not-restored}"
            printf 'Host build exact cache-hit: `%s`\n\n' "${HOST_BUILD_HIT:-not-restored}"
            echo 'All test/build steps still execute. Native acceptance images are not cached.'
            echo 'Use job step durations for measurements; no speedup is asserted by a cache hit.'
          } >> "$GITHUB_STEP_SUMMARY"

  qemu-smoke:
    name: qemu-smoke
    # Both required checks are independent and run in parallel.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      NOS_QEMU_MACHINE: pc-q35-8.2
      OS_OVMF_CODE: /usr/share/OVMF/OVMF_CODE_4M.fd
      OS_OVMF_VARS: /usr/share/OVMF/OVMF_VARS_4M.fd
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Pinned Python
        uses: ./.github/actions/setup-python
      - name: Rust 1.90.0 and targets
        shell: bash
        run: |
          rustup toolchain install 1.90.0 --profile minimal
          rustup component add --toolchain 1.90.0 rustfmt clippy
          rustup target add --toolchain 1.90.0 x86_64-unknown-none x86_64-unknown-uefi
      - name: Cache Cargo downloads
        id: cargo-downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
          key: cargo-downloads-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/Cargo.lock') }}
      - name: Pinned QEMU and OVMF
        uses: ./.github/actions/setup-qemu
      - name: Record CI toolchain diagnostics
        if: ${{ runner.os == 'Linux' }}
        shell: bash
        run: |
          mkdir -p build/ci-toolchain
          cp "$RUNNER_TEMP/nieuw-os-qemu-environment.txt" build/ci-toolchain/emulator.txt
          {
            python3 --version
            rustc +1.90.0 --version
            cargo +1.90.0 --version
          } | tee build/ci-toolchain/languages.txt
      - name: Preflight
        run: python3 -B tools/preflight.py --strict
      - name: Baseline M6c smoke
        run: |
          python3 -B tools/build.py --kernel-feature milestone-m6c
          python3 -B tools/run_m6c.py --case normal --smoke
      - name: DocumentSession normal and cold-recovery gate
        shell: bash
        run: |
          rm -rf build/ci-document target/ci-document
          NOS_DOCUMENT_SESSION=1 \
          NOS_SDK_RUNTIME=1 \
          NOS_BUILD_DIR="$PWD/build/ci-document" \
          NOS_TARGET_DIR="$PWD/target/ci-document" \
          CARGO_TARGET_DIR="$PWD/target/ci-document" \
          python3 -B tools/test_document_session.py

      - name: Native quantum job interface
        shell: bash
        run: |
          rm -rf build/ci-qsim-job target/ci-qsim-job
          NOS_BUILD_DIR="$PWD/build/ci-qsim-job" \
          NOS_TARGET_DIR="$PWD/target/ci-qsim-job" \
          CARGO_TARGET_DIR="$PWD/target/ci-qsim-job" \
          python3 -B tools/build.py --kernel-feature native-qsim-job
          NOS_BUILD_DIR="$PWD/build/ci-qsim-job" \
          NOS_TARGET_DIR="$PWD/target/ci-qsim-job" \
          CARGO_TARGET_DIR="$PWD/target/ci-qsim-job" \
          python3 -B tools/run_qsim_job.py

      - name: Ordinary SDK app - normal authority
        shell: bash
        run: |
          rm -rf build/ci-sdk-normal target/ci-sdk-normal
          NOS_BUILD_DIR="$PWD/build/ci-sdk-normal" \
          NOS_TARGET_DIR="$PWD/target/ci-sdk-normal" \
          CARGO_TARGET_DIR="$PWD/target/ci-sdk-normal" \
          python3 -B tools/build.py --kernel-feature native-sdk-app
          NOS_BUILD_DIR="$PWD/build/ci-sdk-normal" \
          NOS_TARGET_DIR="$PWD/target/ci-sdk-normal" \
          CARGO_TARGET_DIR="$PWD/target/ci-sdk-normal" \
          python3 -B tools/run_sdk_app.py --case normal
      - name: Ordinary SDK app - denied authority
        shell: bash
        run: |
          rm -rf build/ci-sdk-denied target/ci-sdk-denied
          NOS_BUILD_DIR="$PWD/build/ci-sdk-denied" \
          NOS_TARGET_DIR="$PWD/target/ci-sdk-denied" \
          CARGO_TARGET_DIR="$PWD/target/ci-sdk-denied" \
          python3 -B tools/build.py --kernel-feature test-sdk-app-denied
          NOS_BUILD_DIR="$PWD/build/ci-sdk-denied" \
          NOS_TARGET_DIR="$PWD/target/ci-sdk-denied" \
          CARGO_TARGET_DIR="$PWD/target/ci-sdk-denied" \
          python3 -B tools/run_sdk_app.py --case denied
      - name: Preserve compact QEMU diagnostics
        if: ${{ always() }}
        uses: ./.github/actions/preserve-evidence
        with:
          name: qemu-smoke-evidence
          job-status: ${{ job.status }}
          full-evidence: ${{ github.event_name == 'workflow_dispatch' && inputs.full_evidence }}
          if-no-files-found: warn
          path: |
            build/ci-toolchain/emulator.txt
            build/ci-toolchain/languages.txt
            build/manifest.json
            build/logs/*.json
            build/logs/*.stdout.txt
            build/logs/*.stderr.txt
            build/run/m6c-normal-*/build-manifest.json
            build/run/m6c-normal-*/volume-manifest.json
            build/run/m6c-normal-*/result.json
            build/run/m6c-normal-*/serial.txt
            build/run/m6c-normal-*/stderr.txt
            build/ci-document/manifest.json
            build/ci-document/logs/*.json
            build/ci-document/logs/*.stdout.txt
            build/ci-document/logs/*.stderr.txt
            build/ci-document/document-session-gate/result.json
            build/ci-document/document-session-gate/*.stdout.txt
            build/ci-document/document-session-gate/*.stderr.txt
            build/ci-document/run/m6c-document-session-normal-*/build-manifest.json
            build/ci-document/run/m6c-document-session-normal-*/volume-manifest.json
            build/ci-document/run/m6c-document-session-normal-*/result.json
            build/ci-document/run/m6c-document-session-normal-*/serial.txt
            build/ci-document/run/m6c-document-session-normal-*/stderr.txt
            build/ci-document/run/m6c-document-session-recover-*/build-manifest.json
            build/ci-document/run/m6c-document-session-recover-*/volume-manifest.json
            build/ci-document/run/m6c-document-session-recover-*/result.json
            build/ci-document/run/m6c-document-session-recover-*/serial.txt
            build/ci-document/run/m6c-document-session-recover-*/stderr.txt
            build/ci-qsim-job/manifest.json
            build/ci-qsim-job/users/qsim-job/build-report.json
            build/ci-qsim-job/native-qsim-job-result.json
            build/ci-qsim-job/logs/*.json
            build/ci-qsim-job/logs/*.stdout.txt
            build/ci-qsim-job/logs/*.stderr.txt
            build/ci-qsim-job/run/native-qsim-job-*/result.json
            build/ci-qsim-job/run/native-qsim-job-*/serial.txt
            build/ci-qsim-job/run/native-qsim-job-*/stderr.txt
            build/ci-sdk-normal/manifest.json
            build/ci-sdk-normal/native-sdk-app-normal.json
            build/ci-sdk-normal/logs/*.json
            build/ci-sdk-normal/logs/*.stdout.txt
            build/ci-sdk-normal/logs/*.stderr.txt
            build/ci-sdk-normal/run/native-sdk-app-normal-*/result.json
            build/ci-sdk-normal/run/native-sdk-app-normal-*/serial.txt
            build/ci-sdk-normal/run/native-sdk-app-normal-*/stderr.txt
            build/ci-sdk-denied/manifest.json
            build/ci-sdk-denied/native-sdk-app-denied.json
            build/ci-sdk-denied/logs/*.json
            build/ci-sdk-denied/logs/*.stdout.txt
            build/ci-sdk-denied/logs/*.stderr.txt
            build/ci-sdk-denied/run/native-sdk-app-denied-*/result.json
            build/ci-sdk-denied/run/native-sdk-app-denied-*/serial.txt
            build/ci-sdk-denied/run/native-sdk-app-denied-*/stderr.txt

  upload-coverage-rust:
    name: upload-coverage-rust
    needs: host-quality
    if: ${{ !cancelled() && needs.host-quality.result == 'success' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      code-quality: write
    steps:
      - name: Download coverage artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-report-rust-reports
      - uses: actions/upload-code-coverage@2b21a77928be8d5168c2b9581a67f2adbebacc52 # v1.4.4
        with:
          file: build/coverage-raw/rust-cobertura.xml
          language: Rust
          label: code-coverage-agent

  upload-coverage-python:
    name: upload-coverage-python
    needs: host-quality
    if: ${{ !cancelled() && needs.host-quality.result == 'success' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      code-quality: write
    steps:
      - name: Download coverage artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-report-python-reports
      - uses: actions/upload-code-coverage@2b21a77928be8d5168c2b9581a67f2adbebacc52 # v1.4.4
        with:
          file: build/coverage-raw/python/cobertura.xml
          language: Python
          label: code-coverage-agent

  upload-coverage-javascript:
    name: upload-coverage-javascript
    needs: host-quality
    if: ${{ !cancelled() && needs.host-quality.result == 'success' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      code-quality: write
    steps:
      - name: Download coverage artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-report-javascript-reports
      - uses: actions/upload-code-coverage@2b21a77928be8d5168c2b9581a67f2adbebacc52 # v1.4.4
        with:
          file: build/coverage-raw/node/report/cobertura-coverage.xml
          language: JavaScript
          label: code-coverage-agent
